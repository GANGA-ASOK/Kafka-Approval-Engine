[project]
name = "backend"
version = "0.1.0"
description = "RELAY event-driven approval platform API (FastAPI, Kafka, MongoDB, Redis)"
readme = "README.md"
authors = [
    { name = "GANGA-ASOK", email = "gangaasok05@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.4.0",
    "fastapi>=0.141.1",
    "motor>=3.7.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "mongomock-motor>=0.0.36",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:mongomock.*", "ignore:.*CallSpec2.*"]
